<title>恋桃 都道府県チャレンジ</title>
<style>
:root{--pink:#f43f91;--gray:#d8d8df}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#ffd7ea,#fff8fc);color:#58223f}
header{padding:18px 14px;text-align:center;background:linear-gradient(135deg,#f43f91,#ff8fc0);color:white}
header h1{font-size:24px;margin:0 0 6px}
header p{margin:0;font-weight:700}
main{max-width:1100px;margin:auto;padding:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:#fff;border:2px solid #f7a2c8;border-radius:18px;padding:12px;box-shadow:0 4px 14px #c54a8a22}
.big{font-size:30px;font-weight:900;color:var(--pink);text-align:center}
.layout{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}
#mapWrap{min-height:500px;display:flex;align-items:center;justify-content:center;overflow:auto}
#mapWrap svg{width:100%;height:auto;max-height:650px}
.prefecture{fill:var(--gray);stroke:#fff;stroke-width:1.2;transition:.3s}
.prefecture.done{fill:#ff64a8}
.side img{width:100%;border-radius:18px;display:block}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.pill{padding:8px;border-radius:999px;background:#eee;text-align:center;font-size:13px}
.pill.done{background:#ffd0e5;color:#a80056;font-weight:800}
.note{font-size:12px;color:#7c5a6d;line-height:1.6}
.status{font-weight:800;text-align:center;padding:10px;border-radius:12px;background:#fff1f7;margin-top:10px}
.ok{color:#b0005b}.error{color:#b42318}
button{width:100%;font-size:16px;border:0;border-radius:12px;padding:12px;background:var(--pink);color:#fff;font-weight:900;margin-top:10px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:10px}.side .controls{grid-column:1/-1}#mapWrap{min-height:420px}header h1{font-size:21px}}
</style>
</head>

<script>
const PREFS=["北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県", "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県", "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県", "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県", "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"];
const SHEET_URL="https://script.google.com/macros/s/AKfycbwzk7TMriPikEZyuBnpZQY4aelP9lzmih52942p2KM-hCmBYTFVgPn4P7gV3jztprR8/exec;
const state={};

function normalizePref(s){
  if(!s)return "";
  s=String(s).trim();
  const aliases={"東京":"東京都","大阪":"大阪府","京都":"京都府"};
  if(aliases[s])return aliases[s];
  if(PREFS.includes(s))return s;
  if(PREFS.includes(s+"県"))return s+"県";
  return s;
}
function parseCSV(text){
  const rows=[];let row=[],cell="",quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(c=='"'&&quote&&n=='"'){cell+='"';i++}
    else if(c=='"')quote=!quote;
    else if(c==','&&!quote){row.push(cell);cell=""}
    else if((c=='\n'||c=='\r')&&!quote){if(c=='\r'&&n=='\n')i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c;
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function normalizeCode(el){
 const raw=el.dataset.code||el.getAttribute("data-pref")||el.id||"";
 const m=String(raw).match(/(\d{1,2})/);
 return m?String(Number(m[1])).padStart(2,"0"):null;
}
function render(){
 const done=Object.keys(state).filter(k=>state[k]);
 document.getElementById("count").textContent=done.length;
 document.getElementById("remain").textContent=47-done.length;
 document.querySelectorAll(".prefecture").forEach(el=>{const c=normalizeCode(el);el.classList.toggle("done",!!state[c])});
 const list=document.getElementById("list");list.innerHTML="";
 PREFS.forEach((p,i)=>{const c=String(i+1).padStart(2,"0"),d=document.createElement("div");d.className="pill"+(state[c]?" done":"");d.textContent=(state[c]?"💗 ":"🤍 ")+p+(state[c]?"："+state[c]:"");list.appendChild(d)});
}
async function loadSheet(){
 const status=document.getElementById("status");status.className="status";status.textContent="更新中…";
 try{
   const res=await fetch(SHEET_URL+"&_="+Date.now(),{cache:"no-store"});
   if(!res.ok)throw new Error();
   const rows=parseCSV(await res.text());
   Object.keys(state).forEach(k=>delete state[k]);
   rows.slice(1).forEach(r=>{const pref=normalizePref(r[0]),name=(r[1]||"").trim(),idx=PREFS.indexOf(pref);if(idx>=0&&name)state[String(idx+1).padStart(2,"0")]=name});
   render();
   status.className="status ok";status.textContent="✓ 更新しました "+new Date().toLocaleTimeString("ja-JP");
 }catch(e){
   status.className="status error";status.textContent="読み込めません。共有を「リンクを知っている全員・閲覧者」にしてね";
 }
}
document.getElementById("refresh").onclick=loadSheet;
fetch("https://raw.githubusercontent.com/geolonia/japanese-prefectures/master/map-full.svg").then(r=>r.text()).then(svg=>{document.getElementById("mapWrap").innerHTML=svg;render()}).catch(()=>{document.getElementById("mapWrap").innerHTML="<p>地図を読み込めませんでした。</p>"});
loadSheet();setInterval(loadSheet,15000);
</script>
